<mat-toolbar color="primary">
  <mat-toolbar-row>
    <button mat-icon-button (click)="toggleDrawer()">
      <mat-icon>menu</mat-icon>
    </button>

    <span>My dashboard</span>
  </mat-toolbar-row>
</mat-toolbar>

<mat-sidenav-container autosize class="side-nav-container">
  <mat-sidenav mode="side" [opened]="openMenu">
    <mat-list>
      <mat-list-item>
        <div class="menu-buttons">
          <button matButton="text" routerLink=""><mat-icon class="home">home</mat-icon>Home</button>
        </div>
      </mat-list-item>
      <mat-list-item>
        <div class="menu-buttons">
          <button matButton="text" routerLink="">
            <mat-icon class="profile">person</mat-icon>My profile
          </button>
        </div>
      </mat-list-item>
      <mat-list-item
        ><div class="menu-buttons">
          <button matButton="text" routerLink="">
            <mat-icon class="settings">settings</mat-icon>Settings
          </button>
        </div></mat-list-item
      >
    </mat-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-card class="my-profile-card">
      <mat-card-title class="profile-title"> My profile</mat-card-title>
      <mat-card-content>
        <mat-tab-group>
          <mat-tab label="Personal info"> </mat-tab>
          <mat-tab label="Address info"> </mat-tab>
          <mat-tab label="Company info"> </mat-tab>
        </mat-tab-group>
      </mat-card-content>
      <div class="ag-grid-table">
        <app-ag-grid-table></app-ag-grid-table>
      </div>
    </mat-card>
  </mat-sidenav-content>
</mat-sidenav-container>
