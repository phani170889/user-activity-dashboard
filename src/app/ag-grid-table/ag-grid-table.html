<section class="add-user-section">
  <span style="padding-right: 25px">
    <button matButton="filled" color="accent" class="user-button" (click)="addOrEditUser('add')">
      Add user
    </button>
  </span>
  <span>
    <button matButton="filled" color="accent" class="user-button" (click)="searchUser('search')">
      Search user
    </button>
  </span>
</section>

<!-- The AG Grid component -->
<section>
  <ag-grid-angular
    class="ag-theme-alpine"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [domLayout]="'autoHeight'"
    [theme]="theme"
    [pagination]="pagination"
    [paginationPageSize]="paginationPageSize"
    [paginationPageSizeSelector]="paginationPageSizeSelector"
    [loading]="isTableLoading"
    [rowHeight]="50"
    (gridReady)="onGridReady($event)"
  >
  </ag-grid-angular>
</section>
